name: Deploy to server

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy to remote host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        run: |
          echo "Checking secrets..."
          host="${{ secrets.SERVER_HOST }}"
          user="${{ secrets.SERVER_USER }}"
          ssh_key="${{ secrets.SERVER_SSH }}"
          port="${{ secrets.DEPLOY_PORT }}"
          path="${{ secrets.DEPLOY_PATH }}"
          passphrase="${{ secrets.SERVER_PASSPHRASE }}"
          [ -n "$host" ] || (echo "SERVER_HOST is not set" && exit 1)
          [ -n "$user" ] || (echo "SERVER_USER is not set" && exit 1)
          [ -n "$ssh_key" ] || (echo "SERVER_SSH is not set" && exit 1)
          [ -n "$port" ] || (echo "DEPLOY_PORT is not set" && exit 1)
          [ -n "$path" ] || (echo "DEPLOY_PATH is not set" && exit 1)
          echo "All required secrets are set."
          echo "Lengths:"
          echo "SERVER_HOST: ${#host}"
          echo "SERVER_USER: ${#user}"
          echo "SERVER_SSH: ${#ssh_key}"
          echo "DEPLOY_PORT: ${#port}"
          echo "DEPLOY_PATH: ${#path}"
          echo "SERVER_PASSPHRASE: ${#passphrase}"
          echo "SSH key fingerprint:"
          echo "$ssh_key" > temp_key
          chmod 600 temp_key
          ssh-keygen -y -f temp_key | ssh-keygen -lf -
          rm temp_key

      - name: Debug SSH key
        run: |
          echo "${{ secrets.SERVER_SSH }}" > temp_key
          chmod 600 temp_key
          echo "SSH key info:"
          ssh-keygen -lf temp_key
          rm temp_key

      - name: Deploy to server over SSH
        run: |
          echo "${{ secrets.SERVER_SSH }}" > deploy_key
          chmod 600 deploy_key
          ssh -o StrictHostKeyChecking=no -i deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            echo "Deploy started on $(hostname)"
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "ERROR: DEPLOY_PATH secret is not set" >&2
              exit 1
            fi
            cd "$DEPLOY_PATH"

            # ensure clean working copy and get latest main
            git fetch --all --prune
            git reset --hard origin/main

            # Pull images (if using docker images) and rebuild
            if command -v docker >/dev/null 2>&1; then
              docker compose pull db --ignore-pull-failures || true
              docker compose up -d --build --no-deps bot_food
            fi

            # Try running migrations if alembic available
            if command -v uv >/dev/null 2>&1; then
              uv run alembic upgrade head || true
            fi

            echo "Deploy finished"
          EOF
          rm deploy_key
