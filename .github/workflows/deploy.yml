name: Deploy to server

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy to remote host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        run: |
          echo "Checking secrets..."
          [ -n "${{ secrets.SERVER_HOST }}" ] || (echo "SERVER_HOST is not set" && exit 1)
          [ -n "${{ secrets.SERVER_USER }}" ] || (echo "SERVER_USER is not set" && exit 1)
          [ -n "${{ secrets.SERVER_SSH }}" ] || (echo "SERVER_SSH is not set" && exit 1)
          [ -n "${{ secrets.DEPLOY_PORT }}" ] || (echo "DEPLOY_PORT is not set" && exit 1)
          [ -n "${{ secrets.DEPLOY_PATH }}" ] || (echo "DEPLOY_PATH is not set" && exit 1)
          echo "All required secrets are set."
          echo "Lengths:"
          echo "SERVER_HOST: ${#{{ secrets.SERVER_HOST }}}"
          echo "SERVER_USER: ${#{{ secrets.SERVER_USER }}}"
          echo "SERVER_SSH: ${#{{ secrets.SERVER_SSH }}}"
          echo "DEPLOY_PORT: ${#{{ secrets.DEPLOY_PORT }}}"
          echo "DEPLOY_PATH: ${#{{ secrets.DEPLOY_PATH }}}"
          echo "SERVER_PASSPHRASE: ${#{{ secrets.SERVER_PASSPHRASE }}}"

      - name: Debug SSH key
        run: |
          echo "${{ secrets.SERVER_SSH }}" > temp_key
          chmod 600 temp_key
          echo "SSH key info:"
          ssh-keygen -lf temp_key
          rm temp_key

      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            echo "Deploy started on  $(hostname)"
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "ERROR: DEPLOY_PATH secret is not set" >&2
              exit 1
            fi
            cd "$DEPLOY_PATH"

            # ensure clean working copy and get latest main
            git fetch --all --prune
            git reset --hard origin/main

            # Pull images (if using docker images) and rebuild
            if command -v docker >/dev/null 2>&1; then
              docker compose pull --ignore-pull-failures || true
              docker compose up -d --build --remove-orphans
            fi

            # Try running migrations if alembic available
            if command -v uv >/dev/null 2>&1; then
              uv run alembic upgrade head || true
            fi

            echo "Deploy finished"
