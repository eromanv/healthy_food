[project]
name = "healthy-food-bot"
version = "0.1.0"
description = "Telegram bot for meal planning"
authors = [{name = "Roman"}]
dependencies = [
    "aiogram==3.13.1",
    "pydantic==2.9.2",
    "sqlalchemy==2.0.0",
    "asyncpg==0.29.0",
    "python-dotenv==1.0.0",
    "alembic==1.13.0",
    "psycopg2-binary==2.9.9"
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
